html,body{margin:0;width:100%;height:100%;background:#080b0e;overflow:hidden}
#site{width:100%;height:100%;border:0;display:block;background:#080b0e}
</style>

<body>
<iframe id="site" src="/landing.html" title="Noch was drin? Finanzierungs-Check"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w||!d) return;
  w.result=function(){
    const form=d.getElementById('q');
    const progress=d.querySelector('.progress');
    const box=d.getElementById('result');
    if(form) form.style.display='none';
    if(progress) progress.style.display='none';
    if(box) box.classList.add('show');
    const badge=d.getElementById('badge');
    const rt=d.getElementById('rt');
    const rp=d.getElementById('rp');
    if(badge) badge.textContent='Persönliche Prüfung';
    if(rt) rt.textContent='Deine Angaben sind vollständig.';
    if(rp) rp.textContent='Der Online-Check trifft keine Kreditentscheidung. Wenn du möchtest, können deine Angaben jetzt an einen zuständigen Finanzierungspartner zur persönlichen Prüfung weitergegeben werden.';
  };
  const textOf=(name)=>{
    const e=d.querySelector('input[name="'+name+'"]:checked');
    return e ? e.parentElement.textContent.trim() : '';
  };
  w.submitLead=async function(){
    const fn=d.getElementById('fn'), ph=d.getElementById('ph'), zip=d.getElementById('zip'), em=d.getElementById('em'), cons=d.getElementById('cons');
    if(!fn?.value.trim()||!ph?.value.trim()||!zip?.value.trim()){w.alert('Bitte Vorname, Telefon und PLZ ausfüllen.');return}
    if(!cons?.checked){w.alert('Bitte zuerst der Verarbeitung deiner Angaben zustimmen.');return}
    const btn=d.querySelector('.submit');
    const old=btn?.textContent||'Persönliche Prüfung anfordern →';
    if(btn){btn.disabled=true;btn.textContent='Wird sicher übermittelt …'}
    const payload={
      source:'nochwasdrin.pages.dev',
      pageVersion:'2026-08-20',
      contact:{firstName:fn.value.trim(),phone:ph.value.trim(),zip:zip.value.trim(),email:em?.value.trim()||''},
      answers:{
        netIncome:textOf('income'),incomeType:textOf('type'),employmentDuration:textOf('emp'),requestedAmount:textOf('amt'),
        existingObligations:textOf('debt'),paymentProblems:textOf('pay'),creditFile:textOf('ksv'),gamblingTransactions:textOf('game'),
        housingCosts:textOf('home'),coApplicant:textOf('co')
      },
      consent:true
    };
    try{
      const r=await fetch('/api/lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
      const data=await r.json().catch(()=>({}));
      if(!r.ok||!data.ok) throw new Error(data.error||'Übertragung fehlgeschlagen');
      const h=d.querySelector('.form h3');
      if(h) h.textContent='Anfrage erfolgreich übermittelt.';
      const grid=d.querySelector('.grid'); if(grid) grid.style.display='none';
      const c=d.querySelector('.cons'); if(c) c.style.display='none';
      if(btn){btn.textContent='✓ Erfolgreich übermittelt';btn.disabled=true}
    }catch(e){
      if(btn){btn.disabled=false;btn.textContent=old}
      w.alert('Die sichere Übermittlung ist noch nicht vollständig eingerichtet. Bitte später erneut versuchen.');
    }
  };
});
</script>
